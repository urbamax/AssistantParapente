name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Le jeton de la CI ne peut que lire le dépôt (jamais écrire, jamais publier).
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm test

      # Tests Python de la réparation des caractères des données de sites (spec 003).
      - run: python3 -m unittest discover -s tests/scripts

      - run: npm run build

  # Tests de bout en bout sur Chromium et WebKit (constitution, principe IV ; spec 006).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Une PR qui ne touche que les explications du QCM, la documentation ou les fichiers de projet
      # ne peut pas casser le parcours des écrans : lint-and-test lance déjà les tests de données et de format.
      # Le job reste vert sans lancer les 8 minutes de navigateurs, pour ne pas bloquer une protection de branche.
      - id: scope
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)"
            others="$(printf '%s\n' "$changed" | grep -vE '^(js/data/qcm_ffvl_explanations\.csv|.*\.md|LICENSE|NOTICE|\.github/.*)$' || true)"
            if [ -n "$changed" ] && [ -z "$others" ]; then
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Tests e2e ignorés (doc / explications seulement) : $skip"

      - if: steps.scope.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - if: steps.scope.outputs.skip != 'true'
        run: npm ci

      - if: steps.scope.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium webkit

      - if: steps.scope.outputs.skip != 'true'
        run: npm run test:e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.scope.outputs.skip != 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
