# Configuration nginx du conteneur « assistant-parapente » (Raspberry Pi).
# Fichier de référence versionné : il est monté dans le conteneur sur /etc/nginx/conf.d/default.conf.
# Pour l'appliquer : voir deploy/README.md (test avant remplacement, rechargement de ce seul conteneur).

# Cache : version.json n'est jamais gardé (encart « Mettre à jour »), le reste est toujours revérifié
# pour qu'un git pull soit visible tout de suite.
map $uri $ap_cache_control {
    default        "no-cache";
    /version.json  "no-store";
}

server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas annoncer la version de nginx.
    server_tokens off;

    # Site statique : ni écriture ni autre méthode.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # --- En-têtes de sécurité (sur toutes les réponses, erreurs comprises) ---
    # HTTPS exigé pendant un an. Sans includeSubDomains : les autres sous-domaines ne sont pas concernés.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Le navigateur ne devine jamais un type de fichier.
    add_header X-Content-Type-Options "nosniff" always;
    # Seul ce site peut en afficher des pages dans un cadre (le lecteur de cours en a besoin).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Position et micro (réponses vocales) pour ce site seulement ; le reste est coupé.
    add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(), payment=(), usb=(), serial=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
    add_header Cache-Control $ap_cache_control always;

    # Ne jamais servir l'historique git ni les fichiers de développement
    location ~ /\.(?!well-known/) { return 404; }
    location ~ ^/(tests|node_modules|specs|scripts|functions|types|dist|deploy|test-results|playwright-report)(/|$) { return 404; }
    location ~ ^/[^/]+\.(md|py|sh|command|lock|rules)$ { return 404; }
    location ~ ^/(package(-lock)?\.json|firebase\.json|jsconfig\.json|[^/]+\.config\.m?js)$ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
