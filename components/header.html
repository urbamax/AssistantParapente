<div class="header-top-row">
    <div class="header-nav-slot"></div>
    <div class="header-branding">
        <h1 class="dashboard-title" onclick="if(window.Engine) Engine.showDashboard()" style="cursor:pointer;">ASSISTANT
            PARAPENTE</h1>
    </div>
    <div class="header-actions-slot">
        <button id="theme-toggle" class="icon-btn" onclick="if(window.Engine) Engine.toggleTheme()"
            title="Mode: Auto (Système)">
            <div class="auto-icon-composite">
                <i class="ri-sun-line"></i>
                <i class="ri-moon-line"></i>
            </div>
        </button>
    </div>
</div>
<div class="header-level-row">
    <div class="level-select-container">
        <label for="global-level-select">
            <i class="ri-graduation-cap-line"></i> NIVEAU</label>
        <select id="global-level-select" onchange="if(window.Engine) Engine.changeLevel(this.value)" autocomplete="off">
            <option value="ALL">TOUS LES NIVEAUX</option>
            <option value="BI">BREVET INITIAL</option>
            <option value="BP">BREVET PILOTE</option>
            <option value="BPC">BREVET PILOTE CONFIRMÉ</option>
            <option value="TREUIL">TREUIL</option>
        </select>
    </div>
</div>
